name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MembershipPlatform.sln

      - name: Build
        run: dotnet build MembershipPlatform.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MembershipPlatform.sln --no-build --configuration Release
